<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mail preview</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eceee9; color: #1c2220; }
  .msg { max-width: 560px; margin: 15vh auto; padding: 24px; background: #fff; border: 1px solid #cdd3cf; border-radius: 12px; }
</style>
</head>
<body>
<div class="msg" id="msg">Preview laden…</div>
<script>
(async function () {
  var msg = document.getElementById("msg");
  try {
    var params = new URLSearchParams(location.hash.slice(1));
    var z = params.get("z");
    if (!z) { msg.textContent = "Geen preview gevonden in deze link."; return; }
    var b64 = z.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    msg.textContent = "Deze link kon niet worden geopend. Mogelijk is hij afgekapt bij het kopiëren.";
  }
})();
</script>
</body>
</html>
